[project]
name = "decision-tree-from-scratch"
version = "0.1.0"
description = "CART decision trees and random forests implemented from first principles in NumPy: Gini/entropy/variance splits, stopping rules, feature importances and out-of-bag scoring."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rafferty Carter-Lazenbury" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_tree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=decision_tree --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["decision_tree"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY"]
